      <div class="rv-panel" style="flex:1;overflow-y:auto">
        <h4>💬 기존 댓글 샘플 <span style="font-weight:400;color:var(--muted);font-size:11px">(최근 ${Math.min(profile.samples.length,5)}건)</span></h4>
        ${profile.samples.slice(0,5).map(s=>{
          const text=typeof s==='string'?s:(s.reply||s.text||'');
          return `<div class="rv-sample">${text.length>200?text.slice(0,200)+'...':text}</div>`;
        }).join('')}
      </div>`:''}
    </div>

    <!-- 오른쪽: 리뷰 입력 & 생성 -->
    <div class="rv-right">
      <div class="rv-panel">
        <h4>📝 고객 리뷰 입력</h4>
        <textarea id="rv-review" class="rv-textarea" rows="6" placeholder="고객이 남긴 리뷰를 붙여넣기 하세요...&#10;&#10;예: 아이들과 함께 갔는데 시설도 깨끗하고 사장님도 친절하셔서 너무 좋았어요! 계곡이 바로 앞이라 물놀이하기 좋았습니다. 다음에 꼭 또 갈게요~"></textarea>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <button class="rv-btn" onclick="handleGenerateReply()" id="rv-gen-btn" ${!reviewCampId?'disabled':''}>✍️ 답변 생성</button>
          <select id="rv-tone-override" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px">
            <option value="">캠지기 스타일 유지</option>
            <option value="formal">격식체로 변환</option>
            <option value="casual">친근체로 변환</option>
            <option value="short">간결하게</option>
            <option value="detailed">상세하게</option>
          </select>
        </div>
      </div>

      <div class="rv-panel" style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h4 style="margin:0">💌 생성된 답변</h4>
          <div style="display:flex;gap:6px">
            <button class="rv-btn-copy" onclick="copyReply()">📋 복사</button>
            <button class="rv-btn-copy" onclick="handleGenerateReply()">🔄 재생성</button>
          </div>
        </div>
        <div id="rv-output" class="rv-output" style="min-height:200px">
          <span style="color:var(--muted)">캠핑장을 선택하고 고객 리뷰를 입력한 후 [답변 생성] 버튼을 눌러주세요.</span>
        </div>
        <div id="rv-topics" style="margin-top:10px"></div>
      </div>
    </div>
  </div>`;

  el.innerHTML=html;
}

function handleGenerateReply(){
  const review=document.getElementById('rv-review')?.value?.trim();
  if(!review){showToast('고객 리뷰를 입력해주세요','var(--red)');return}
  if(!reviewCampId){showToast('캠핑장을 선택해주세요','var(--red)');return}

  const camp=camps.find(c=>campKey(c)===reviewCampId);
  const campName=camp?.name||reviewCampId;
  const profile=CAMP_REPLY_PROFILES[reviewCampId]||null;
  const toneOverride=document.getElementById('rv-tone-override')?.value;

  // 토픽 추출
  const topics=extractTopics(review);

  // 답변 생성
  let reply=generateReply(campName,review,profile);

  // 톤 오버라이드
  if(toneOverride==='formal'){
    reply=reply.replace(/ㅎㅎ|ㅋㅋ/g,'').replace(/😊|🙏|💚|🌿|🏕|⛺|🔥|👨‍👩‍👧‍👦/g,'').replace(/:[\)D]/g,'');
  }else if(toneOverride==='short'){
    const sentences=reply.split(/[.\n]/).filter(s=>s.trim());
    reply=sentences.slice(0,3).join('. ')+'.';
  }

  // 출력
  document.getElementById('rv-output').textContent=reply;
  document.getElementById('rv-topics').innerHTML=topics.length?
    `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">감지된 토픽</div>${topics.map(t=>`<span class="rv-tag" style="background:#3b2f63;color:var(--purple)">${t}</span>`).join('')}`:'';
}

function copyReply(){
  const text=document.getElementById('rv-output')?.textContent;
  if(!text||text.includes('버튼을 눌러주세요')){showToast('복사할 답변이 없습니다','var(--red)');return}
  navigator.clipboard.writeText(text).then(()=>showToast('답변이 복사되었습니다!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('답변이 복사되었습니다!');
  });
}

// 캠핑장 댓글 데이터 로드 (나중에 파일/API에서 채움)
function loadReplyProfiles(data){
  // data = { "캠핑장명": [ {reply:"댓글내용", review:"원래리뷰"}, ... ], ... }
  Object.entries(data).forEach(([campName,replies])=>{
    // 캠핑장명으로 매칭
    const camp=camps.find(c=>(c.name||'').includes(campName)||campKey(c).includes(campName));
    const pk=camp?campKey(camp):campName;
    const profile=analyzeStyle(replies);
    if(profile)CAMP_REPLY_PROFILES[pk]=profile;
  });
}

// ==================== CREATE TASK FROM MATRIX ====================
async function createAndCycleTask(campId,taskName,title){
  // OP_GROUPS에서 카테고리 자동 매핑
  const taskId=taskName.replace('OP_','').replace('PREP_','');
  const catMatch=OP_GROUPS.find(g=>g.tasks.some(t=>t.id===taskId));
  const category=catMatch?.cat||'';
  const taskType='standard';
  try{
    const res=await fetch(`${API}/api/tasks`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({PK:`CAMP#${campId}`,SK:`TASK#${taskName}`,taskName,title,status:'미시작',taskType,category,campCode:campId,pin:'1234'})
    });
    const json=await res.json();
    if(json.success){
      addLog('task',campId,`과업 ${taskName} 생성 (미시작)`);
      showToast(`${campId} — ${title} 과업 생성`);
      await loadAll();
    }else{
      showToast(json.error||'과업 생성 실패','var(--red)');
    }
  }catch(e){showToast('오류: '+e.message,'var(--red)')}
}

// ==================== MATRIX MEMO ====================
function openMatrixMemo(el,pk){
  // 기존 열린 에디터 닫기
  document.querySelectorAll('.mx-memo-edit').forEach(e=>e.remove());
  const c=camps.find(x=>campKey(x)===pk);
  if(!c)return;
  const memo=(c.matrixMemo||'').trim();
  const cell=el.closest('.mx-memo-cell');
  const editor=document.createElement('div');
  editor.className='mx-memo-edit';
  editor.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px">${c.name} 메모</div>
    <textarea id="mx-memo-ta">${memo}</textarea>
    <div class="mx-memo-btns">
      <button onclick="this.closest('.mx-memo-edit').remove()" style="background:var(--card);color:var(--muted)">취소</button>
      <button onclick="saveMatrixMemo('${pk}')" style="background:var(--accent);color:#000;font-weight:700;border-color:var(--accent)">저장</button>
    </div>
  `;
  cell.appendChild(editor);
  editor.querySelector('textarea').focus();
}

async function saveMatrixMemo(pk){
  const ta=document.getElementById('mx-memo-ta');
  if(!ta)return;
  const memo=ta.value.trim();
  try{
    const res=await fetch(`${API}/api/camps/${encodeURIComponent(pk)}/profile`,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({matrixMemo:memo})
    });
    const json=await res.json();
    if(json.success){
      addLog('edit',pk,`현황판 메모 수정`);
      showToast(`${pk} 메모 저장 완료`);
      document.querySelectorAll('.mx-memo-edit').forEach(e=>e.remove());
      await loadAll();
    }else{
      showToast(json.error||'저장 실패','var(--red)');
    }
  }catch(e){showToast('오류: '+e.message,'var(--red)')}
}

// 클릭 외부시 메모 에디터 닫기
document.addEventListener('click',function(e){
  if(!e.target.closest('.mx-memo-cell')&&!e.target.closest('.mx-memo-edit')){
    document.querySelectorAll('.mx-memo-edit').forEach(el=>el.remove());
  }
});

// ==================== UTILS ====================
function campKey(c){return c.PK?.replace('CAMP#','')||c.name||''}
function campKey2(t){return t.PK?.replace('CAMP#','')||''}
function trunc(s,n){return s?.length>n?s.substring(0,n)+'...':s||''}
function showToast(msg,bg='var(--green)'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=bg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

async function changeCampStatus(campId,newStatus){
  const signal=STATUS_EMOJI[newStatus]||'⚪';
  try{
    const res=await fetch(`${API}/api/camps/${encodeURIComponent(campId)}/profile`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus,signal})});
    const json=await res.json();
    if(json.success){addLog('status',campId,`상태 변경 → ${newStatus}`);showToast(`${campId} → ${newStatus}`);await loadAll()}
    else showToast(json.error,'var(--red)');
  }catch(e){showToast('오류','var(--red)')}
}

// Init
loadAll();
setInterval(loadAll,60000);
</script>
