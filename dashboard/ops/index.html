<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PICCO OPS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f97583;--purple:#d2a8ff;--yellow:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;background:#0c0f14;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:16px;font-size:16px;font-weight:800;color:#fff;border-bottom:1px solid var(--border)}
.sidebar-logo span{color:var(--accent)}
.nav-item{padding:10px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted);transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:#161b22;color:var(--text)}
.nav-item.active{background:#1c2333;color:#fff;border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px 16px;font-size:11px;color:#333;border-top:1px solid var(--border)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-bar h2{font-size:16px;font-weight:700;color:#fff}
.top-bar .meta{font-size:11px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:16px 20px}

/* Pipeline Kanban */
.kanban{display:flex;gap:10px;overflow-x:auto;height:100%}
.kanban-col{min-width:200px;flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.kanban-head{padding:10px 12px;font-size:12px;font-weight:700;color:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-shrink:0}
.kanban-head .cnt{background:var(--accent);color:#000;border-radius:8px;padding:0 7px;font-size:11px}
.kanban-body{padding:6px;overflow-y:auto;flex:1}
.k-card{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:5px;cursor:pointer;transition:.15s;font-size:12px}
.k-card:hover{border-color:var(--accent)}
.k-card .name{font-weight:600;color:#fff;margin-bottom:2px}
.k-card .info{color:var(--muted);font-size:11px}
.k-card .actions{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.k-card .actions button{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.k-card .actions button:hover{border-color:var(--accent);color:#fff}

/* Operations Matrix */
.matrix-wrap{overflow-x:auto}
.matrix{border-collapse:collapse;font-size:12px;width:100%;min-width:600px}
.matrix th{background:#21262d;padding:8px 6px;text-align:center;color:var(--muted);font-weight:600;border:1px solid var(--border);position:sticky;top:0;z-index:2;white-space:nowrap}
.matrix th:first-child{text-align:left;position:sticky;left:0;z-index:3;min-width:130px}
.matrix td{padding:5px;text-align:center;border:1px solid #1a1f2b}
.matrix td:first-child{text-align:left;font-weight:600;color:#fff;position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap}
.matrix tr:hover td{background:#1c2333}
.matrix tr:hover td:first-child{background:#1c2333}
.signal{display:inline-block;width:24px;height:24px;border-radius:5px;font-size:12px;line-height:24px;text-align:center;cursor:pointer;transition:.15s}
.signal:hover{transform:scale(1.2)}
.sig-done{background:#064e3b;color:#6ee7b7}
.sig-wip{background:#1e3a5f;color:#93c5fd}
.sig-todo{background:#7f1d1d;color:#fca5a5}
.sig-ext{background:#92400e;color:#fbbf24}
.sig-hold{background:#3b2f63;color:#c4b5fd}
.sig-na{background:#161b22;color:#333}
.matrix-legend{display:flex;gap:12px;margin:10px 0;font-size:11px;color:var(--muted)}
.matrix-legend span{display:flex;align-items:center;gap:4px}
.matrix-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.matrix-tab{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.2s}
.matrix-tab:hover,.matrix-tab.active{border-color:var(--accent);color:#fff}

/* Camp Cards */
.camp-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.camp-controls select,.camp-controls input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px}
.status-group{margin-bottom:20px}
.status-group-header{font-size:13px;font-weight:700;padding:8px 12px;border-radius:6px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.camp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.camp-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;transition:.15s;cursor:pointer}
.camp-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.camp-card .c-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.camp-card .c-name{font-size:14px;font-weight:700;color:#fff}
.camp-card .c-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
.camp-card .c-meta{font-size:11px;color:var(--muted);line-height:1.6}
.camp-card .c-meta b{color:var(--text)}
.camp-card .c-tasks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.camp-card .c-tasks span{font-size:10px;padding:2px 6px;border-radius:3px}
.camp-card .c-notes{font-size:11px;color:#6e7681;margin-top:6px;border-top:1px solid #1a1f2b;padding-top:6px}
/* Progress bar */
.progress-bar{height:4px;background:#21262d;border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px}
/* Stats row */
.stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:100px;text-align:center}
.stat-card .num{font-size:24px;font-weight:800;color:#fff}
.stat-card .label{font-size:11px;color:var(--muted);margin-top:2px}

/* Camp Detail Panel */
.detail-panel{position:fixed;right:0;top:0;width:420px;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:50;overflow-y:auto;padding:20px;display:none;box-shadow:-4px 0 20px rgba(0,0,0,.3)}
.detail-panel.open{display:block}
.detail-panel .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.detail-panel h3{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.detail-panel .d-status{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:700;display:inline-block;margin-bottom:12px}
.detail-section{margin-bottom:16px}
.detail-section h4{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.d-field{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a1f2b;font-size:12px}
.d-field:last-child{border:none}
.d-field .label{color:var(--muted)}
.d-field .value{color:#fff;font-weight:600}
.d-task{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #1a1f2b;font-size:12px}
.d-task:last-child{border:none}
.d-task .tid{color:var(--accent);font-weight:700;min-width:45px}
.d-task .ttitle{flex:1;color:var(--text)}

/* Chat */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 120px)}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.chat-msg.user{background:var(--accent);color:#000;align-self:flex-end;border-bottom-right-radius:2px}
.chat-msg.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:2px}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input input{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px}
.chat-input input:focus{outline:none;border-color:var(--accent)}
.chat-input button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}

/* Status colors */
.st-live{background:#064e3b;color:#6ee7b7}.st-contract{background:#1e3a5f;color:#93c5fd}
.st-meeting{background:#3b2f63;color:#c4b5fd}.st-new{background:#21262d;color:#8b949e}
.st-hold{background:#7f1d1d;color:#fca5a5}.st-closed{background:#1a1a2e;color:#555}
.st-mou{background:#92400e;color:#fbbf24}

/* Dashboard KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:.15s}
.kpi-box:hover{border-color:var(--accent);transform:translateY(-2px)}
.kpi-num{font-size:48px;font-weight:900;line-height:1}
.kpi-label{font-size:13px;color:var(--muted);margin-top:8px}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.hold-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.hold-card .h-name{font-size:14px;font-weight:700;color:#fff}
.hold-card .h-reason{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-header{padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal-day{background:var(--card);border:1px solid var(--border);border-radius:6px;min-height:100px;padding:6px;font-size:11px;transition:.15s}
.cal-day:hover{border-color:var(--accent)}
.cal-day.today{border-color:var(--accent);background:#1c2333}
.cal-day.other-month{opacity:.3}
.cal-day .day-num{font-weight:700;color:var(--text);margin-bottom:4px;font-size:12px}
.cal-day.today .day-num{color:var(--accent)}
.cal-event{background:#1e3a5f;border-left:3px solid var(--accent);border-radius:3px;padding:2px 5px;margin-bottom:3px;font-size:10px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event:hover{background:#2a4a6f}
.cal-event.meeting{border-left-color:var(--purple);background:#2d1f4e}
.cal-event.meeting-pending{border-left-color:var(--yellow);background:#2a2008;border-style:dashed}
.cal-event.contract{border-left-color:var(--green);background:#0a3622}
.cal-event.live{border-left-color:var(--yellow);background:#2a2008}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-nav button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
.cal-nav button:hover{border-color:var(--accent)}
.cal-nav .cal-title{font-size:18px;font-weight:700;color:#fff}

/* Activity Log */
.log-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:12px}
.log-item:last-child{border:none}
.log-time{color:var(--muted);min-width:140px;white-space:nowrap;font-size:11px}
.log-icon{font-size:16px;min-width:24px;text-align:center}
.log-body{flex:1;color:var(--text);line-height:1.6}
.log-body b{color:#fff}
.log-badge{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:4px}

/* Edit Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.edit-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:460px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.edit-modal h3{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.edit-modal h3 .close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.edit-modal .form-group{margin-bottom:14px}
.edit-modal .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.edit-modal .form-group input,.edit-modal .form-group select,.edit-modal .form-group textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit}
.edit-modal .form-group input:focus,.edit-modal .form-group select:focus,.edit-modal .form-group textarea:focus{outline:none;border-color:var(--accent)}
.edit-modal .form-group textarea{min-height:80px;resize:vertical}
.edit-modal .btn-row{display:flex;gap:8px;margin-top:18px}
.edit-modal .btn-primary{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:13px;flex:1}
.edit-modal .btn-primary:hover{opacity:.9}
.edit-modal .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 20px;cursor:pointer;font-size:13px}
.edit-modal .btn-secondary:hover{border-color:var(--accent)}
.edit-btn{font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--accent);cursor:pointer;font-weight:600}
.edit-btn:hover{border-color:var(--accent);background:#1c2333}

/* Matrix memo */
.mx-memo-cell{position:relative;min-width:120px;max-width:200px}
.mx-memo-text{font-size:10px;color:var(--muted);max-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:pre-wrap;cursor:pointer;padding:2px 4px;border-radius:4px;transition:.15s}
.mx-memo-text:hover{background:#1c2333;color:var(--text)}
.mx-memo-text.empty{color:#333;font-style:italic}
.mx-memo-edit{position:absolute;top:0;left:0;z-index:10;background:var(--card);border:1px solid var(--accent);border-radius:6px;padding:8px;width:250px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.mx-memo-edit textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px;font-size:11px;font-family:inherit;min-height:60px;resize:vertical}
.mx-memo-edit textarea:focus{outline:none;border-color:var(--accent)}
.mx-memo-edit .mx-memo-btns{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.mx-memo-edit .mx-memo-btns button{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border)}

/* Review Reply */
.rv-container{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 140px)}
.rv-left,.rv-right{display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.rv-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.rv-panel h4{font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rv-textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.6}
.rv-textarea:focus{outline:none;border-color:var(--accent)}
.rv-output{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;color:var(--text);line-height:1.8;white-space:pre-wrap;min-height:120px}
.rv-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;margin-right:4px;margin-bottom:4px}
.rv-sample{background:#0d1117;border-left:3px solid var(--border);border-radius:4px;padding:8px 12px;margin-bottom:6px;font-size:11px;color:var(--muted);line-height:1.6;cursor:pointer;transition:.15s}
.rv-sample:hover{border-left-color:var(--accent);color:var(--text)}
.rv-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s}
.rv-btn:hover{opacity:.9}
.rv-btn:disabled{opacity:.4;cursor:not-allowed}
.rv-btn-copy{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
.rv-btn-copy:hover{border-color:var(--accent)}
.rv-stat{display:flex;gap:8px;flex-wrap:wrap}
.rv-stat-item{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:8px 12px;text-align:center;min-width:80px}
.rv-stat-item .num{font-size:18px;font-weight:800;color:#fff}
.rv-stat-item .lbl{font-size:10px;color:var(--muted);margin-top:2px}
@media(max-width:900px){.rv-container{grid-template-columns:1fr}}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#000;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;display:none;z-index:200}

@media(max-width:768px){
.sidebar{width:56px}.sidebar .nav-text,.sidebar-logo span,.sidebar-footer{display:none}
.sidebar-logo{padding:12px;font-size:14px}
.camp-cards{grid-template-columns:1fr}
.detail-panel{width:100%}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">PICCO <span>OPS</span></div>
  <div class="nav-item active" onclick="navigate('dashboard')"><span class="icon">📈</span><span class="nav-text">대시보드</span></div>
  <div class="nav-item" onclick="navigate('pipeline')"><span class="icon">📊</span><span class="nav-text">파이프라인</span></div>
  <div class="nav-item" onclick="navigate('calendar')"><span class="icon">📅</span><span class="nav-text">미팅 캘린더</span></div>
  <div class="nav-item" onclick="navigate('matrix')"><span class="icon">🚦</span><span class="nav-text">운영 현황판</span></div>
  <div class="nav-item" onclick="navigate('camps')"><span class="icon">🏕️</span><span class="nav-text">캠핑장 현황</span></div>
  <div class="nav-item" onclick="navigate('logs')"><span class="icon">📋</span><span class="nav-text">활동 로그</span></div>
  <div class="nav-item" onclick="navigate('chat')"><span class="icon">💬</span><span class="nav-text">챗봇</span></div>
  <div class="nav-item" onclick="navigate('review')"><span class="icon">✍️</span><span class="nav-text">리뷰 답변</span></div>
  <div class="sidebar-footer">v19 | API 연동</div>
</div>

<div class="main">
  <div class="top-bar">
    <h2 id="pageTitle">파이프라인 보드</h2>
    <div>
      <span class="meta" id="lastUpdate"></span>
      <button onclick="loadAll()" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:8px">새로고침</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- Detail Side Panel -->
<div class="detail-panel" id="detailPanel">
  <button class="close-btn" onclick="closeDetail()">&times;</button>
  <div id="detailContent"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="edit-modal">
    <h3><span id="editModalTitle">캠핑장 수정</span><button class="close-btn" onclick="closeEditModal()">&times;</button></h3>
    <div id="editTabs" style="display:flex;gap:6px;margin-bottom:16px">
      <button class="btn-secondary" style="flex:1;font-size:12px;padding:8px" onclick="switchEditTab('info')" id="tab-info">기본 정보</button>
      <button class="btn-secondary" style="flex:1;font-size:12px;padding:8px" onclick="switchEditTab('meeting')" id="tab-meeting">미팅 일정</button>
      <button class="btn-secondary" style="flex:1;font-size:12px;padding:8px" onclick="switchEditTab('memo')" id="tab-memo">메모</button>
    </div>
    <form id="editForm" onsubmit="saveEdit(event)">
      <input type="hidden" id="edit-pk">
      <!-- 기본 정보 탭 -->
      <div id="editTabInfo">
        <div class="form-group">
          <label>캠핑장명</label>

function generateSlackKPI(){
  const now=new Date();
  const dateStr=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const todayISO=now.toISOString().slice(0,10);
  const dayNames=['일','월','화','수','목','금','토'];

  const liveCamps=camps.filter(c=>c.status==='앱 라이브');
  const contractCamps=camps.filter(c=>['계약 협의','계약 확정','계약 완료'].includes(c.status));
  const meetingCamps=camps.filter(c=>['미팅 확정','미팅 조율'].includes(c.status));
  const newCamps=camps.filter(c=>c.status==='신규 접수');
  const holdCamps=camps.filter(c=>c.status==='보류');
  const closedCamps=camps.filter(c=>c.status==='종결');
  const mouCamps=camps.filter(c=>c.status==='MOU 체결');
  const recontactCamps=camps.filter(c=>c.status==='재접촉 필요');

  const todayNew=camps.filter(c=>c.updatedAt===todayISO&&c.status==='신규 접수');
  const todayMeetingSet=camps.filter(c=>c.updatedAt===todayISO&&['미팅 확정','미팅 조율'].includes(c.status)&&c.nextMeeting);

  // 2주치 미팅
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay());
  const twoWeekEnd=new Date(weekStart);twoWeekEnd.setDate(weekStart.getDate()+13);
  const upcomingMeetings=camps.filter(c=>{if(!c.nextMeeting)return false;const d=new Date(c.nextMeeting);return d>=new Date(todayISO)&&d<=twoWeekEnd}).sort((a,b)=>(a.nextMeeting||'').localeCompare(b.nextMeeting||''));
  const meetingByDate={};
  upcomingMeetings.forEach(c=>{const d=c.nextMeeting.slice(0,10);if(!meetingByDate[d])meetingByDate[d]=[];meetingByDate[d].push(c)});

  function groupByReason(list){const g={};list.forEach(c=>{const r=(c.holdReason||c.notes||'사유 미기재').split('\\n')[0].slice(0,30);if(!g[r])g[r]=[];g[r].push(c.name)});return g}

  let kpi=`📊 PICCO 일일 운영 보고\n${dateStr}\n`;
  kpi+=`\n━━━  파이프라인 (총 ${camps.length}건)  ━━━\n\n`;
  kpi+=`  🟢 운영 중      ${liveCamps.length}개소\n`;
  kpi+=`  🔵 계약 진행    ${contractCamps.length}건  (협의 ${camps.filter(c=>c.status==='계약 협의').length} / 확정 ${camps.filter(c=>c.status==='계약 확정').length})\n`;
  kpi+=`  🟣 미팅 예정    ${meetingCamps.length}건  (확정 ${camps.filter(c=>c.status==='미팅 확정').length} / 조율 ${camps.filter(c=>c.status==='미팅 조율').length})\n`;
  kpi+=`  ⚪ 신규 접수    ${newCamps.length}건\n`;
  kpi+=`  🏗️ MOU          ${mouCamps.length}건`;
  if(recontactCamps.length)kpi+=`\n  🟠 재접촉       ${recontactCamps.length}건`;

  if(todayNew.length||todayMeetingSet.length){
    kpi+=`\n\n━━━  오늘  ━━━\n`;
    if(todayNew.length){kpi+=`\n  🆕 신규 접수 ${todayNew.length}건`;todayNew.forEach(c=>{kpi+=`\n     ${c.name}${c.region?' ['+c.region+']':''}`})}
    if(todayMeetingSet.length){kpi+=`\n  📅 미팅 확정 ${todayMeetingSet.length}건`;todayMeetingSet.forEach(c=>{kpi+=`\n     ${c.name} → ${c.nextMeeting}${c.meetingTime?' '+c.meetingTime:''}`})}
  }

  if(Object.keys(meetingByDate).length){
    kpi+=`\n\n━━━  미팅 캘린더  ━━━\n`;
    Object.entries(meetingByDate).forEach(([date,list])=>{
      const d=new Date(date);const dayName=dayNames[d.getDay()];const isToday=date===todayISO;
      kpi+=`\n  📅 ${date} (${dayName})${isToday?' ← 오늘':''}`;
      list.sort((a,b)=>(a.meetingTime||'99').localeCompare(b.meetingTime||'99'));
      list.forEach(c=>{
        kpi+=`\n     ${c.meetingTime||''} ${c.name}`;
        if(c.md)kpi+=` MD:${c.md}`;
        if(c.meetingVisitor)kpi+=` 👤${c.meetingVisitor}`;
        if(c.region)kpi+=` [${c.region}]`;
      });
    });
  }

  kpi+=`\n\n━━━  매출 현황  ━━━\n\n  API 연동 필요`;

  if(holdCamps.length||closedCamps.length){
    kpi+=`\n\n━━━  보류·종결  ━━━\n`;
    if(holdCamps.length){kpi+=`\n  ⏸ 보류 ${holdCamps.length}건`;const g=groupByReason(holdCamps);Object.entries(g).forEach(([r,n])=>{kpi+=`\n     [${r}] ${n.length}건: ${n.join(', ')}`})}
    if(closedCamps.length){kpi+=`\n  ⚫ 종결 ${closedCamps.length}건`;const g=groupByReason(closedCamps);Object.entries(g).forEach(([r,n])=>{kpi+=`\n     [${r}] ${n.length}건: ${n.join(', ')}`})}
  }

  kpi+=`\n\n━━━━━━━━━━━━━━━━━━━━\n🔗 대시보드: http://picco-dashboard.s3-website.ap-northeast-2.amazonaws.com/ops/`;
  return kpi;
}

function copySlackKPI(){
  const text=document.getElementById('slackKPI').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('Slack KPI 보고 복사 완료!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Slack KPI 보고 복사 완료!');
  });
}

// ==================== CALENDAR ====================
function renderCalendar(el){
  const year=calYear,month=calMonth;
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startDay=firstDay.getDay(); // 0=Sun
  const totalDays=lastDay.getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // 미팅/계약 이벤트 수집
  const events={};
  camps.forEach(c=>{
    if(c.nextMeeting){
      const d=c.nextMeeting.slice(0,10);
      if(!events[d])events[d]=[];
      const mtype=c.status==='미팅 조율'?'meeting-pending':'meeting';
      events[d].push({type:mtype,name:c.name,md:c.md||'',region:c.region||'',status:c.status,time:c.meetingTime||'',visitor:c.meetingVisitor||'',purpose:c.meetingPurpose||''});
    }
    if(c.contractDate){
      const d=c.contractDate.slice(0,10);
      if(!events[d])events[d]=[];
      events[d].push({type:'contract',name:c.name,md:c.md||'',region:c.region||''});
    }
    if(c.liveDate){
      const d=c.liveDate.slice(0,10);
      if(!events[d])events[d]=[];
      events[d].push({type:'live',name:c.name,md:c.md||'',region:c.region||''});
    }
  });

  const monthStr=`${year}년 ${month+1}월`;

  // 미팅 관련 캠핑장 분류
  const meetingConfirmed=camps.filter(c=>c.status==='미팅 확정');
  const meetingPending=camps.filter(c=>c.status==='미팅 조율');
  const meetingAll=[...meetingConfirmed,...meetingPending];
  const withDate=meetingAll.filter(c=>c.nextMeeting);
  const withoutDate=meetingAll.filter(c=>!c.nextMeeting);

  // 전체 예정 미팅 (날짜 있는 것) 카운트
  const upcomingMeetings=camps.filter(c=>c.nextMeeting&&new Date(c.nextMeeting)>=new Date(todayStr));

  let html=`
  <!-- 미팅 현황 요약 -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:32px;font-weight:900;color:var(--purple)">${meetingAll.length}</div>
      <div style="font-size:12px;color:var(--muted)">전체 미팅 대상</div>
    </div>
    <div style="background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:32px;font-weight:900;color:var(--accent)">${meetingConfirmed.length}</div>
      <div style="font-size:12px;color:var(--muted)">미팅 확정</div>
    </div>
    <div style="background:var(--card);border:1px solid var(--yellow);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:32px;font-weight:900;color:var(--yellow)">${meetingPending.length}</div>
      <div style="font-size:12px;color:var(--muted)">일정 조율 중</div>
    </div>
    <div style="background:var(--card);border:1px solid var(--green);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:32px;font-weight:900;color:var(--green)">${upcomingMeetings.length}</div>
      <div style="font-size:12px;color:var(--muted)">향후 미팅 예정</div>
    </div>
  </div>

  ${withoutDate.length?`
  <div style="background:#92400e22;border:1px solid var(--yellow);border-radius:10px;padding:14px;margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:10px">⚠️ 일정 미확정 — 조율 필요 (${withoutDate.length}건)</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${withoutDate.map(c=>`
        <div onclick="openEditModal('${campKey(c)}')" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;transition:.15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <span>${c.status==='미팅 확정'?'🟡':'🟠'}</span>
          <b style="color:#fff">${c.name}</b>
          ${c.md?`<span style="background:var(--accent);color:#000;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px">${c.md}</span>`:''}
          ${c.region?`<span style="color:var(--muted);font-size:10px">📍${c.region}</span>`:''}
          <span style="color:${c.status==='미팅 확정'?'var(--accent)':'var(--yellow)'};font-size:10px">${c.status}</span>
        </div>
      `).join('')}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">카드를 클릭하면 미팅 일정을 등록할 수 있습니다.</div>
  </div>`:''}

  <div class="cal-nav">
    <button onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}render()">&larr; 이전</button>
    <button onclick="calYear=new Date().getFullYear();calMonth=new Date().getMonth();render()">오늘</button>
    <button onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}render()">다음 &rarr;</button>
    <span class="cal-title">${monthStr}</span>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:12px;font-size:11px;color:var(--muted)">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--purple);border-radius:2px;margin-right:4px"></span>미팅 확정</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--yellow);border-radius:2px;margin-right:4px"></span>미팅 조율</span>

  <div class="cal-grid">
    <div class="cal-header">일</div><div class="cal-header">월</div><div class="cal-header">화</div>
    <div class="cal-header">수</div><div class="cal-header">목</div><div class="cal-header">금</div><div class="cal-header">토</div>`;

  // 이전 달 빈 칸
  const prevMonthLast=new Date(year,month,0).getDate();
  for(let i=startDay-1;i>=0;i--){
    const d=prevMonthLast-i;
    html+=`<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  }

  // 현재 달
  for(let d=1;d<=totalDays;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const dayEvents=events[dateStr]||[];
    html+=`<div class="cal-day ${isToday?'today':''}">
      <div class="day-num">${d}</div>`;
    dayEvents.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    dayEvents.forEach(ev=>{
      const typeClass=ev.type==='meeting'?'meeting':ev.type==='meeting-pending'?'meeting':ev.type==='contract'?'contract':'live';
      const icon=ev.type==='meeting'?'🤝':ev.type==='meeting-pending'?'🟠':ev.type==='contract'?'📝':'🟢';
      const timeStr=ev.time?ev.time+' ':'';
      let people='';
      if(ev.md)people+=`<span style="color:var(--accent);font-size:9px">MD:${ev.md}</span>`;
      if(ev.visitor)people+=`<span style="color:#fbbf24;font-size:9px"> 👤${ev.visitor}</span>`;
      html+=`<div class="cal-event ${typeClass}" onclick="event.stopPropagation();openEditModal('${ev.name}')" title="${ev.name} ${timeStr}담당:${ev.md||'-'} 방문:${ev.visitor||'-'} ${ev.purpose||''} ${ev.region}" style="white-space:normal;overflow:visible;line-height:1.4">
        ${icon} ${timeStr}<b>${ev.name}</b><br>${people}
      </div>`;
    });
    html+=`</div>`;
  }

  // 다음 달 빈 칸
  const endDay=new Date(year,month,totalDays).getDay();
  for(let i=1;i<=6-endDay;i++){
    html+=`<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;
  }

  html+=`</div>

  <!-- 이번 달 미팅 목록 -->
  <div style="margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px">
    <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:12px">${monthStr} 미팅 일정</div>
    ${(()=>{
      const monthEvents=[];
      Object.entries(events).forEach(([date,evs])=>{
        if(date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)){
          evs.filter(e=>e.type==='meeting'||e.type==='meeting-pending').forEach(e=>monthEvents.push({...e,date}));
        }
      });
      monthEvents.sort((a,b)=>a.date.localeCompare(b.date));
      if(!monthEvents.length)return '<div style="font-size:12px;color:var(--muted)">이번 달 예정된 미팅이 없습니다.</div>';
      return monthEvents.map(e=>{
        const isPending=e.type==='meeting-pending';
        const statusBadge=isPending
          ?`<span style="background:#92400e;color:#fbbf24;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">조율 중</span>`
          :`<span style="background:#3b2f63;color:#c4b5fd;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">확정</span>`;
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1a1f2b;font-size:13px;cursor:pointer;${isPending?'border-left:3px solid var(--yellow);padding-left:10px':''}" onclick="openEditModal('${e.name}')">
          <span style="font-weight:700;color:var(--purple);min-width:90px">${e.date}</span>
          <span style="color:var(--accent);min-width:45px;font-weight:600">${e.time||''}</span>
          ${statusBadge}
          <span style="color:#fff;font-weight:600">${e.name}</span>
          ${e.md?`<span style="font-size:11px;color:var(--accent)">MD: ${e.md}</span>`:''}
          ${e.visitor?`<span style="font-size:11px;color:var(--yellow)">👤 방문: ${e.visitor}</span>`:''}
          ${e.region?`<span style="color:var(--muted);font-size:11px">📍 ${e.region}</span>`:''}
          ${e.purpose?`<span style="font-size:11px;color:var(--muted)">${e.purpose}</span>`:''}
          <button class="edit-btn" onclick="event.stopPropagation();openEditModal('${e.name}')" style="margin-left:auto">✏️</button>
        </div>`;
      }).join('');
    })()}
  </div>`;

  el.innerHTML=html;
}

// ==================== PIPELINE ====================

// 대분류 집계용 매핑
const PIPELINE_GROUPS={
  '상담·접수':['신규 접수','미팅 조율','재접촉 필요'],
  '미팅 진행':['미팅 확정'],
  '계약 진행':['계약 협의','계약 확정','계약 완료'],
  '운영 중':['앱 라이브'],
  '특수 프로젝트':['MOU 체결'],
  '보류·종결':['보류','종결'],
};

function renderPipeline(el){
  // 대분류 집계
  const megaCounts={};
  for(const[mega,statuses] of Object.entries(PIPELINE_GROUPS)){
    megaCounts[mega]=camps.filter(c=>statuses.includes(c.status)).length;
  }

  // 상단 버튼
  let html=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button onclick="openCreateModal()" style="background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13px">+ 새 캠핑장 등록</button>
  </div>`;

  // Summary cards
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">';
  const megaStyles={
    '상담·접수':{color:'#8b949e'},
    '미팅 진행':{color:'#8b949e'},
    '계약 진행':{color:'#c9d1d9'},
    '운영 중':{color:'#c9d1d9'},
    '특수 프로젝트':{color:'#8b949e'},
    '보류·종결':{color:'#8b949e'},
  };
  html+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
    <div style="font-size:28px;font-weight:800;color:#fff">${camps.length}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">전체</div>
  </div>`;
  for(const[mega,count] of Object.entries(megaCounts)){
    const st=megaStyles[mega]||{color:'#8b949e'};
    html+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
      <div style="font-size:28px;font-weight:800;color:${st.color}">${count}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${mega}</div>
    </div>`;
  }
  html+='</div>';

  // 칸반 보드 (세분화)
  const groups={};
  STAGES.forEach(s=>groups[s]=[]);
  groups['보류/종결']=[];
  camps.forEach(c=>{if(groups[c.status])groups[c.status].push(c);else groups['보류/종결'].push(c)});

  // 각 열 내부 가나다순 정렬
  Object.keys(groups).forEach(k=>{
    groups[k].sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
  });

  html+='<div class="kanban">';
  [...STAGES,'보류/종결'].forEach(stage=>{
    const items=groups[stage]||[];
    // 계약 관련 컬럼 강조
    const isContractCol=['계약 협의','계약 확정'].includes(stage);
    const isMouCol=stage==='MOU 체결';
    const colStyle=isContractCol?'border-color:#2a3a5a':isMouCol?'border-color:#3a3020':'';
    html+=`<div class="kanban-col" style="${colStyle}"><div class="kanban-head">${stage}<span class="cnt">${items.length}</span></div><div class="kanban-body">`;
    items.forEach(c=>{
      const pk=campKey(c);
      const si=STAGES.indexOf(c.status);
      let btns='';
      if(si>0)btns+=`<button onclick="event.stopPropagation();changeCampStatus('${pk}','${STAGES[si-1]}')">&larr;</button>`;
      if(si>=0&&si<STAGES.length-1)btns+=`<button onclick="event.stopPropagation();changeCampStatus('${pk}','${STAGES[si+1]}')">&rarr;</button>`;
      html+=`<div class="k-card" onclick="openDetail('${pk}')">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
          <div style="font-size:14px;font-weight:700;color:#fff">${c.name||pk}</div>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap">${c.md||''}</span>
        </div>
        ${c.region?`<div style="font-size:11px;color:var(--muted);margin-bottom:2px">${c.region}</div>`:''}
        ${(c.weekdayRate||c.weekendRate)?`<div style="font-size:10px;margin-bottom:2px;display:flex;gap:6px"><span style="color:var(--accent)">평일 ${c.weekdayRate||'-'}%</span><span style="color:var(--yellow)">주말 ${c.weekendRate||'-'}%</span></div>`:''}
        ${c.notes?`<div class="info">${trunc(c.notes,50)}</div>`:''}
        <div class="actions">${btns}<button class="edit-btn" onclick="event.stopPropagation();openEditModal('${pk}')">✏️ 수정</button></div>
      </div>`;
    });
    html+='</div></div>';
  });
  html+='</div>';

  // 🗑 삭제됨 (휴지통)
  if(deletedCamps.length){
    html+=`<div style="margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px">🗑 휴지통 (${deletedCamps.length}건)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">`;
    deletedCamps.forEach(c=>{
      html+=`<div style="background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted)">
        ${c.name||campKey(c)}${c.region?' · '+c.region:''}
      </div>`;
    });
    html+=`</div></div>`;
  }

  el.innerHTML=html;
}

// ==================== OPERATIONS MATRIX ====================
let expandedCamp=null;

// 컬럼 커스텀 설정 (localStorage 저장)
const MX_PREF_KEY='picco_matrix_pref';
function loadMatrixPref(){
  try{return JSON.parse(localStorage.getItem(MX_PREF_KEY))||{}}catch(e){return{}}
}
function saveMatrixPref(p){localStorage.setItem(MX_PREF_KEY,JSON.stringify(p))}
// pref: { hiddenCats:[], hiddenTasks:[], colWidths:{}, rowHeight:'normal'|'compact'|'wide' }

function renderMatrix(el){
  const pref=loadMatrixPref();
  const hiddenCats=pref.hiddenCats||[];
  const hiddenTasks=pref.hiddenTasks||[];
  const colWidths=pref.colWidths||{};
  const rowSize=pref.rowSize||'normal'; // compact, normal, wide
  const showMemo=pref.showMemo!==false;
  const showRate=pref.showRate!==false;
  const nameW=colWidths['_name']||130;
  const memoW=colWidths['_memo']||160;
  const cellW=colWidths['_cell']||32;
  const rowPad={compact:2,normal:6,wide:12}[rowSize]||6;
  const cellFont={compact:11,normal:13,wide:16}[rowSize]||13;
  const nameFont={compact:10,normal:12,wide:14}[rowSize]||12;

  const liveCamps=camps.filter(c=>['앱 라이브'].includes(c.status));
  const campTaskMap={};
  tasks.forEach(t=>{const pk=t.PK||'';if(!campTaskMap[pk])campTaskMap[pk]=[];campTaskMap[pk].push(t)});

  const matrixMd=document.getElementById('mx-md')?.value||'';
  const matrixSort=document.getElementById('mx-sort')?.value||'name';

  let filtered=[...liveCamps];
  if(matrixMd)filtered=filtered.filter(c=>c.md===matrixMd);
  if(matrixSort==='name')filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
  else if(matrixSort==='rate')filtered.sort((a,b)=>calcRate(b,campTaskMap)-calcRate(a,campTaskMap));
  else if(matrixSort==='md')filtered.sort((a,b)=>(a.md||'zzz').localeCompare(b.md||'zzz'));

  const mds=[...new Set(liveCamps.map(c=>c.md).filter(Boolean))].sort();
  const totalCheck=OP_GROUPS.flatMap(g=>g.tasks.filter(t=>t.type==='check')).length;
  let totalDone=0,totalAll=0;
  filtered.forEach(c=>{const r=calcRate(c,campTaskMap);totalDone+=Math.round(r*totalCheck/100);totalAll+=totalCheck});
  const overallRate=totalAll?Math.round(totalDone/totalAll*100):0;

  // 보이는 그룹/태스크만 필터
  const visibleGroups=OP_GROUPS.filter(g=>!hiddenCats.includes(g.cat));
  const allTasks=visibleGroups.flatMap(g=>g.tasks.filter(t=>!hiddenTasks.includes(t.id)).map(t=>({...t,cat:g.cat,color:g.color})));

  const settingsOpen=document.getElementById('mx-settings-open')?.dataset?.open==='1';

  let html=`
  <!-- 상단 요약 -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:28px;font-weight:900;color:var(--green)">${filtered.length}</div>
      <div style="font-size:11px;color:var(--muted)">운영 중</div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:28px;font-weight:900;color:${overallRate>=60?'var(--green)':overallRate>=30?'var(--yellow)':'var(--red)'}">${overallRate}%</div>
      <div style="font-size:11px;color:var(--muted)">전체 세팅 완료율</div>
    </div>
    ${mds.map(m=>{
      const mc=filtered.filter(c=>c.md===m);
      if(!mc.length)return '';
      const mr=mc.length?Math.round(mc.reduce((s,c)=>s+calcRate(c,campTaskMap),0)/mc.length):0;
      return `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;${matrixMd===m?'border-color:var(--accent)':''}" onclick="document.getElementById('mx-md').value='${matrixMd===m?'':m}';render()">
        <div style="font-size:20px;font-weight:800;color:var(--accent)">${mc.length}<span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:4px">${mr}%</span></div>
        <div style="font-size:11px;color:${matrixMd===m?'var(--accent)':'var(--muted)'}">${m}</div>
      </div>`;
    }).join('')}
  </div>

  <!-- 필터/정렬/설정 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
    <input type="hidden" id="mx-md" value="${matrixMd}">
    <select id="mx-sort" onchange="render()" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px">
      <option value="name" ${matrixSort==='name'?'selected':''}>이름순</option>
      <option value="rate" ${matrixSort==='rate'?'selected':''}>완료율순</option>
      <option value="md" ${matrixSort==='md'?'selected':''}>MD순</option>
    </select>
    ${matrixMd?`<div style="background:var(--accent);color:#000;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;cursor:pointer" onclick="document.getElementById('mx-md').value='';render()">👤 ${matrixMd} ✕</div>`:''}
    <span style="font-size:11px;color:var(--muted);margin-left:auto">${filtered.length}개소</span>
    <div id="mx-settings-open" data-open="${settingsOpen?'1':'0'}" onclick="this.dataset.open=this.dataset.open==='1'?'0':'1';document.getElementById('mx-settings-panel').style.display=this.dataset.open==='1'?'block':'none'" style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--accent);user-select:none">⚙️ 표 설정</div>
  </div>

  <!-- 설정 패널 -->
  <div id="mx-settings-panel" style="display:${settingsOpen?'block':'none'};background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">

      <!-- 카테고리 표시/숨기기 -->
      <div style="min-width:180px">
        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">카테고리 표시</div>
        ${OP_GROUPS.map(g=>{
          const hidden=hiddenCats.includes(g.cat);
          return `<label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer;font-size:11px;color:${hidden?'#555':g.color}">
            <input type="checkbox" ${hidden?'':'checked'} onchange="toggleMatrixCat('${g.cat}')"> ${g.cat} <span style="color:var(--muted);font-size:9px">(${g.tasks.length})</span>
          </label>`;
        }).join('')}
      </div>

      <!-- 개별 컬럼 표시/숨기기 -->
      <div style="min-width:200px;max-height:200px;overflow-y:auto">
        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">개별 항목 표시</div>
        ${OP_GROUPS.filter(g=>!hiddenCats.includes(g.cat)).map(g=>
          g.tasks.map(t=>{
            const hidden=hiddenTasks.includes(t.id);
            return `<label style="display:flex;align-items:center;gap:6px;margin-bottom:3px;cursor:pointer;font-size:10px;color:${hidden?'#555':g.color}">
              <input type="checkbox" ${hidden?'':'checked'} onchange="toggleMatrixTask('${t.id}')"> ${t.label}
            </label>`;
          }).join('')
        ).join('')}
      </div>

      <!-- 크기 조절 -->
      <div style="min-width:200px">
        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">행 높이</div>
        <div style="display:flex;gap:4px;margin-bottom:12px">
          ${['compact','normal','wide'].map(s=>`<button onclick="updateMatrixPref('rowSize','${s}')" style="padding:4px 12px;border-radius:4px;border:1px solid ${rowSize===s?'var(--accent)':'var(--border)'};background:${rowSize===s?'var(--accent)':'var(--card)'};color:${rowSize===s?'#000':'var(--text)'};font-size:10px;cursor:pointer;font-weight:${rowSize===s?'700':'400'}">${{compact:'좁게',normal:'보통',wide:'넓게'}[s]}</button>`).join('')}
        </div>

        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">셀 너비: ${cellW}px</div>
        <input type="range" min="20" max="60" value="${cellW}" oninput="updateMatrixPref('colWidths',Object.assign(loadMatrixPref().colWidths||{},{_cell:+this.value}))" style="width:100%;accent-color:var(--accent)">

        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;margin-top:8px">캠핑장 열: ${nameW}px</div>
        <input type="range" min="80" max="250" value="${nameW}" oninput="updateMatrixPref('colWidths',Object.assign(loadMatrixPref().colWidths||{},{_name:+this.value}))" style="width:100%;accent-color:var(--accent)">

        <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;margin-top:8px">메모 열: ${memoW}px</div>
        <input type="range" min="60" max="400" value="${memoW}" oninput="updateMatrixPref('colWidths',Object.assign(loadMatrixPref().colWidths||{},{_memo:+this.value}))" style="width:100%;accent-color:var(--accent)">

        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          <label style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" ${showRate?'checked':''} onchange="updateMatrixPref('showRate',this.checked)"> 완료율 표시</label>
          <label style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" ${showMemo?'checked':''} onchange="updateMatrixPref('showMemo',this.checked)"> 메모 표시</label>
        </div>

        <button onclick="localStorage.removeItem('${MX_PREF_KEY}');render()" style="margin-top:10px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--red);font-size:10px;cursor:pointer">초기화</button>
      </div>
    </div>
  </div>

  <!-- 테이블형 매트릭스 -->
  <div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)">
  <table style="border-collapse:collapse;font-size:11px;white-space:nowrap;table-layout:fixed">
    <colgroup>
      <col style="width:${nameW}px">
      ${showRate?'<col style="width:48px">':''}
      ${allTasks.map(()=>`<col style="width:${cellW}px">`).join('')}
      ${showMemo?`<col style="width:${memoW}px">`:''}
    </colgroup>
    <thead>
      <tr style="background:#161b22">
        <th rowspan="2" style="position:sticky;left:0;z-index:3;background:#161b22;padding:${rowPad}px 8px;text-align:left;border-bottom:2px solid var(--border);border-right:2px solid var(--border);font-size:${nameFont}px;color:var(--text)">캠핑장</th>
        ${showRate?`<th rowspan="2" style="padding:${rowPad}px 2px;text-align:center;border-bottom:2px solid var(--border);color:var(--muted)">완료</th>`:''}
        ${visibleGroups.map(g=>{const cnt=g.tasks.filter(t=>!hiddenTasks.includes(t.id)).length;return cnt?`<th colspan="${cnt}" style="padding:${rowPad}px 2px;text-align:center;border-bottom:1px solid var(--border);border-left:2px solid var(--border);color:${g.color};font-weight:800;font-size:11px">${g.cat}</th>`:''}).join('')}
        ${showMemo?`<th rowspan="2" style="padding:${rowPad}px 4px;text-align:left;border-bottom:2px solid var(--border);border-left:2px solid var(--border);color:var(--yellow)">메모</th>`:''}
      </tr>
      <tr style="background:#0d1117">
        ${allTasks.map(t=>`<th style="padding:4px 3px;text-align:center;border-bottom:2px solid var(--border);border-left:1px solid #1e242e;color:var(--muted);font-weight:400;font-size:10px;white-space:nowrap" title="${t.label}${t.note?' ('+t.note+')':''}">${t.label}</th>`).join('')}

  filtered.forEach((c,idx)=>{

    const rowBg=idx%2===0?'transparent':'#0a0e14';

    html+=`<tr style="background:${rowBg};border-bottom:1px solid #1a1f2b" onmouseover="this.style.background='#1c2333'" onmouseout="this.style.background='${rowBg}'">
      <td style="position:sticky;left:0;z-index:2;background:${idx%2===0?'var(--card)':'#0d1117'};padding:${rowPad}px 8px;border-right:2px solid var(--border);font-weight:600;color:#fff;font-size:${nameFont}px;overflow:hidden;text-overflow:ellipsis">

        ${rowSize!=='compact'?`<div style="font-size:9px;color:var(--muted);font-weight:400;margin-top:1px">${c.md||''}</div>`:''}
      </td>
      ${showRate?`<td style="text-align:center;padding:${rowPad}px 2px;font-weight:800;font-size:${nameFont}px;color:${barColor}">${rate}%</td>`:''}`;

    allTasks.forEach((taskDef,ti)=>{
      const tName='OP_'+taskDef.id;
      const match=ct.find(t=>(t.taskName||'')===tName||(t.taskName||'').includes(taskDef.id));
      const isFirstInGroup=ti===0||allTasks[ti-1].cat!==taskDef.cat;
      const borderLeft=isFirstInGroup?'border-left:2px solid var(--border);':'border-left:1px solid #1a1f2b;';

      if(taskDef.type==='check'){
        const status=match?.status||'미시작';
        const isDone=status==='완료';
        const icon=isDone?'✅':'';
        const bg=isDone?'#0d2818':'';
        const clickFn=match?`cycleStatus('${pk}','${match.taskName||tName}')`:`createAndCycleTask('${pk}','${tName}','${taskDef.label}')`;
        html+=`<td onclick="${clickFn}" style="text-align:center;padding:${rowPad-2}px 1px;cursor:pointer;${borderLeft}${bg?'background:'+bg+';':''}font-size:${cellFont}px" title="${taskDef.label}: ${isDone?'진행':'미진행'}">${icon}</td>`;
      }else{
        const memo=match?.memo||'';
        const status=match?.status||'미시작';
        const isDone=status==='완료';
        const hasContent=memo||isDone;
        const icon=isDone?'✅':memo?'📝':'';
        const bg=hasContent?'#1a1520':'';
        html+=`<td onclick="openTaskInput(event,this,'${pk}','${tName}','${taskDef.label}')" style="text-align:center;padding:${rowPad-2}px 1px;cursor:pointer;${borderLeft}${bg?'background:'+bg+';':''}font-size:${cellFont}px;position:relative" title="${taskDef.label}: ${memo||status}${taskDef.note?' ('+taskDef.note+')':''}">${icon}</td>`;
      }
    });

    if(showMemo){
      html+=`<td style="padding:${rowPad}px 6px;border-left:2px solid var(--border);white-space:normal;word-break:break-all;overflow:hidden">
        <div class="mx-memo-cell" onclick="openMatrixMemo(this,'${pk}')" style="font-size:10px;color:${memoRaw?'var(--text)':'#333'};cursor:pointer;line-height:1.4;max-height:${rowSize==='compact'?20:40}px;overflow:hidden">${memoRaw||'+'}</div>
      </td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>

  <!-- 운영 리소스 (복사 가능) -->
  <div style="margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px">
    <h4 style="margin:0 0 12px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px">
      <span style="font-size:16px">📎</span> 운영 양식 & 링크 <span style="font-size:10px;color:var(--muted);font-weight:400">클릭하면 클립보드에 복사됩니다</span>
    </h4>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px">
      ${OP_RESOURCES.map((r,i)=>`
        <div id="res-card-${i}" onclick="copyResource(${i})" style="background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:.2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:18px">${r.icon}</span>
            <span style="font-size:12px;font-weight:700;color:var(--text)">${r.label}</span>
            <span style="margin-left:auto;font-size:10px;color:var(--accent);opacity:.7">📋 복사</span>
          </div>
          <div style="font-size:10px;color:var(--muted);line-height:1.5">${r.desc}</div>
          <div style="margin-top:6px;padding:6px 8px;background:#161b22;border-radius:4px;font-size:10px;color:#8b949e;max-height:48px;overflow:hidden;white-space:pre-line;font-family:monospace">${r.text.replace(/</g,'&lt;').slice(0,120)}${r.text.length>120?'...':''}</div>
        </div>
      `).join('')}
    </div>
  </div>`;

  el.innerHTML=html;
}

function toggleMatrixCat(cat){
  const p=loadMatrixPref();

  const idx=h.indexOf(cat);
  if(idx>=0)h.splice(idx,1);else h.push(cat);
  p.hiddenCats=h;
  saveMatrixPref(p);render();
}
function toggleMatrixTask(taskId){
  const p=loadMatrixPref();
  const h=p.hiddenTasks||[];
  const idx=h.indexOf(taskId);
  if(idx>=0)h.splice(idx,1);else h.push(taskId);
  p.hiddenTasks=h;
  saveMatrixPref(p);render();
}
function updateMatrixPref(key,val){
  const p=loadMatrixPref();
  p[key]=val;
  saveMatrixPref(p);render();
}

// 내용기입/주기 과업 인라인 편집
function openTaskInput(evt,cell,campId,taskName,label){
  if(evt){evt.stopPropagation();evt.preventDefault();}
  document.querySelectorAll('.mx-memo-edit').forEach(e=>e.remove());
  const ct=tasks.find(t=>(t.PK===`CAMP#${campId}`)&&((t.taskName||'')===taskName));
  const curMemo=ct?.memo||'';
  const curStatus=ct?.status||'미시작';
  const isDone=curStatus==='완료';

  const editor=document.createElement('div');
  editor.className='mx-memo-edit';
  editor.style.cssText='width:240px;position:absolute;z-index:10;top:100%;left:0;background:#161b22;border:1px solid var(--accent);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)';
  editor.onclick=function(e){e.stopPropagation()};
  editor.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px">${label}</div>
    <textarea id="mx-task-ta" style="width:100%;box-sizing:border-box;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px;font-size:11px;font-family:inherit;min-height:50px;resize:vertical">${curMemo}</textarea>
    <div style="display:flex;gap:4px;margin-top:6px;align-items:center">
      <select id="mx-task-status" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:10px;flex:1">
        <option value="미시작" ${!isDone?'selected':''}>⬜ 미진행</option>
        <option value="완료" ${isDone?'selected':''}>✅ 진행</option>
      </select>
      <button onclick="this.closest('.mx-memo-edit').remove()" style="font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted)">취소</button>
      <button onclick="saveTaskInput('${campId}','${taskName}','${label}')" style="font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#000;font-weight:700">저장</button>
    </div>
  `;
  cell.style.position='relative';
  cell.appendChild(editor);
  editor.querySelector('textarea').focus();
}

async function saveTaskInput(campId,taskName,label){
  const memo=document.getElementById('mx-task-ta')?.value||'';
  const status=document.getElementById('mx-task-status')?.value||'미시작';
  const existing=tasks.find(t=>(t.PK===`CAMP#${campId}`)&&((t.taskName||'')===taskName));

  try{
    if(existing){
      // 업데이트
      const res=await fetch(`${API}/api/tasks/${encodeURIComponent(campId)}/${encodeURIComponent(taskName)}`,{
        method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({status,memo})
      });
      const json=await res.json();
      if(json.success){showToast(`${label} 저장 완료`);document.querySelectorAll('.mx-memo-edit').forEach(e=>e.remove());await loadAll()}
      else showToast(json.error||'실패','var(--red)');
    }else{
      // 신규 생성
      const catMatch=OP_GROUPS.find(g=>g.tasks.some(t=>t.id===taskName.replace('OP_','')));
      const res=await fetch(`${API}/api/tasks`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({PK:`CAMP#${campId}`,SK:`TASK#${taskName}`,taskName,title:label,status,memo,taskType:'standard',category:catMatch?.cat||'',campCode:campId,pin:'1234'})
      });
      const json=await res.json();
      if(json.success){showToast(`${label} 생성 및 저장 완료`);document.querySelectorAll('.mx-memo-edit').forEach(e=>e.remove());await loadAll()}
      else showToast(json.error||'실패','var(--red)');
    }
  }catch(e){showToast('오류: '+e.message,'var(--red)')}
}

function calcRate(camp,campTaskMap){
  const ct=campTaskMap[camp.PK]||[];
  const checkIds=OP_GROUPS.flatMap(g=>g.tasks.filter(t=>t.type==='check').map(t=>t.id));
  let done=0;
  checkIds.forEach(tid=>{
    const match=ct.find(t=>(t.taskName||'')==='OP_'+tid||(t.taskName||'').includes(tid));
    if(match&&match.status==='완료')done++;
  });
  return checkIds.length?Math.round(done/checkIds.length*100):0;
}

async function cycleStatus(campId,taskName){
  // 진행/미진행 토글
  const task=tasks.find(t=>(campKey2(t)===campId)&&(t.taskName===taskName||t.SK===`TASK#${taskName}`));
  if(!task)return;
  const newStatus=task.status==='완료'?'미시작':'완료';
  try{
    const res=await fetch(`${API}/api/tasks/${encodeURIComponent(campId)}/${encodeURIComponent(taskName)}`,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status:newStatus})
    });
    const json=await res.json();
    if(json.success){addLog('task',campId,`과업 ${taskName} → ${newStatus}`);showToast(`${taskName} → ${newStatus}`);loadAll()}
    else showToast(json.error||'실패','var(--red)');
  }catch(e){showToast('오류','var(--red)')}
}

// ==================== CAMPS ====================
function renderCamps(el){
  // Stats
  const statusCounts={};
  camps.forEach(c=>{statusCounts[c.status]=(statusCounts[c.status]||0)+1});

  let html='<div class="stats-row">';
  const statItems=[
    {label:'전체',num:camps.length,color:'#fff'},
    {label:'라이브',num:statusCounts['앱 라이브']||0,color:'var(--green)'},
    {label:'계약',num:(statusCounts['계약 확정']||0)+(statusCounts['계약 완료']||0)+(statusCounts['계약 협의']||0),color:'var(--accent)'},
    {label:'미팅',num:(statusCounts['미팅 확정']||0)+(statusCounts['미팅 조율']||0),color:'var(--purple)'},
    {label:'신규',num:statusCounts['신규 접수']||0,color:'var(--muted)'},
    {label:'보류/종결',num:(statusCounts['보류']||0)+(statusCounts['종결']||0),color:'var(--red)'},
  ];
  statItems.forEach(s=>{
    html+=`<div class="stat-card"><div class="num" style="color:${s.color}">${s.num}</div><div class="label">${s.label}</div></div>`;
  });
  html+='</div>';

  // Sort/filter controls
  const sortBy=document.getElementById('cf-sort')?.value||'status';
  const filterMd=document.getElementById('cf-md')?.value||'';
  const filterRegion=document.getElementById('cf-region')?.value||'';
  const searchQ=document.getElementById('cf-search')?.value?.toLowerCase()||'';

  const mds=[...new Set(camps.map(c=>c.md).filter(Boolean))].sort();
  const regions=[...new Set(camps.map(c=>c.region).filter(Boolean))].sort();

  html+=`<div class="camp-controls">
    <select id="cf-sort" onchange="render()">
      <option value="status" ${sortBy==='status'?'selected':''}>상태별 정렬</option>
      <option value="region" ${sortBy==='region'?'selected':''}>지역별 정렬</option>
      <option value="md" ${sortBy==='md'?'selected':''}>MD별 정렬</option>
      <option value="sites" ${sortBy==='sites'?'selected':''}>사이트 수 (많은순)</option>
      <option value="name" ${sortBy==='name'?'selected':''}>이름순</option>
    </select>
    <select id="cf-md" onchange="render()"><option value="">전체 MD</option>${mds.map(m=>`<option ${filterMd===m?'selected':''}>${m}</option>`).join('')}</select>
    <select id="cf-region" onchange="render()"><option value="">전체 지역</option>${regions.map(r=>`<option ${filterRegion===r?'selected':''}>${r}</option>`).join('')}</select>
    <input id="cf-search" placeholder="검색..." value="${searchQ}" oninput="render()" style="min-width:120px">
  </div>`;

  // Filter
  let filtered=[...camps];
  if(filterMd)filtered=filtered.filter(c=>c.md===filterMd);
  if(filterRegion)filtered=filtered.filter(c=>c.region===filterRegion);
  if(searchQ)filtered=filtered.filter(c=>(c.name||'').toLowerCase().includes(searchQ)||(c.notes||'').toLowerCase().includes(searchQ));

  // Sort & group
  if(sortBy==='status'){
    // Group by status
    const grouped={};
    STATUS_ORDER.forEach(s=>grouped[s]=[]);
    filtered.forEach(c=>{
      const s=c.status||'신규 접수';
      if(!grouped[s])grouped[s]=[];
      grouped[s].push(c);
    });
    STATUS_ORDER.forEach(status=>{
      const items=grouped[status];
      if(!items||!items.length)return;
      const cls=STATUS_CLS[status]||'st-new';
      const emoji=STATUS_EMOJI[status]||'';
      html+=`<div class="status-group">
        <div class="status-group-header"><span class="c-badge ${cls}" style="font-size:12px;padding:4px 10px">${emoji} ${status} (${items.length})</span></div>
        <div class="camp-cards">${items.map(c=>campCard(c)).join('')}</div>
      </div>`;
    });
  }else{
    // Sort flat
    if(sortBy==='region')filtered.sort((a,b)=>(a.region||'').localeCompare(b.region||''));
    else if(sortBy==='md')filtered.sort((a,b)=>(a.md||'zzz').localeCompare(b.md||'zzz'));
    else if(sortBy==='sites')filtered.sort((a,b)=>(b.siteCount||0)-(a.siteCount||0));
    else if(sortBy==='name')filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));

    if(sortBy==='region'||sortBy==='md'){
      const key=sortBy==='region'?'region':'md';
      const groups={};
      filtered.forEach(c=>{const k=c[key]||'미지정';if(!groups[k])groups[k]=[];groups[k].push(c)});
      Object.entries(groups).forEach(([k,items])=>{
        html+=`<div class="status-group">
          <div class="status-group-header"><span style="color:var(--accent)">${k} (${items.length})</span></div>
          <div class="camp-cards">${items.map(c=>campCard(c)).join('')}</div>
        </div>`;
      });
    }else{
      html+=`<div class="camp-cards">${filtered.map(c=>campCard(c)).join('')}</div>`;
    }
  }

  el.innerHTML=html;
}

function campCard(c){
  const pk=campKey(c);
  const cls=STATUS_CLS[c.status]||'st-new';
  const ct=tasks.filter(t=>t.PK===c.PK);
  const done=ct.filter(t=>t.status==='완료').length;
  const total=ct.length;
  const rate=total?Math.round(done/total*100):0;
  const barColor=rate>=80?'var(--green)':rate>=50?'var(--yellow)':'var(--red)';

  return`<div class="camp-card" onclick="openDetail('${pk}')">
    <div class="c-top">
      <div class="c-name">${campSignal(c)} ${c.name||pk}</div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="edit-btn" onclick="event.stopPropagation();openEditModal('${pk}')">✏️ 수정</button>
        <span class="c-badge ${cls}">${c.status}</span>
      </div>
    </div>
    <div class="c-meta">
      ${c.region?`<b>지역</b> ${c.region} &nbsp;`:''}
      ${c.siteCount?`<b>사이트</b> ${c.siteCount}개 &nbsp;`:''}
      ${c.md?`<b>MD</b> ${c.md} &nbsp;`:''}
      ${c.contractDate?`<br><b>계약</b> ${c.contractDate}`:''}
      ${c.nextMeeting?` &nbsp;<b>미팅</b> ${c.nextMeeting}`:''}
    </div>
    ${total?`<div class="c-tasks">
      ${done?`<span class="sig-done" style="padding:1px 5px;border-radius:3px;font-size:10px">완료 ${done}</span>`:''}
      ${total-done?`<span class="sig-todo" style="padding:1px 5px;border-radius:3px;font-size:10px">잔여 ${total-done}</span>`:''}
      <span style="color:var(--muted);font-size:10px">${rate}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${rate}%;background:${barColor}"></div></div>`:''}
    ${c.notes?`<div class="c-notes">${trunc(c.notes,80)}</div>`:''}
  </div>`;
}

  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <span class="d-status ${cls}" style="margin:0">${c.status}</span>

  ${c.notes?`<div class="detail-section"><h4>메모</h4><div style="font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap">${c.notes}</div></div>`:''}

    ct.forEach(t=>{
      const st=SIG_MAP[t.status]||{cls:'sig-na',icon:'?'};
      html+=`<div class="d-task">
        <div class="tid">${t.taskName||'?'}</div>

  </div>`;
  chatHistory.forEach(m=>{
    html+=`<div class="chat-msg ${m.role}">${m.text}</div>`;
    // 확정 버튼 표시
    if(m.pendingAction&&m===chatHistory[chatHistory.length-1]){
      html+=`<div style="align-self:flex-start;margin-top:4px;display:flex;gap:6px">
        <button onclick="confirmPending()" style="background:var(--green);color:#000;border:none;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13px">✅ 확정 (DB 반영)</button>
        <button onclick="cancelPending()" style="background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">취소</button>
      </div>`;
    }
  });
  html+='</div><div class="chat-input"><input id="chatInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key===\'Enter\')sendChat()"><button onclick="sendChat()">전송</button></div></div>';
  el.innerHTML=html;
  const msgs=document.getElementById('chatMessages');
  if(msgs)msgs.scrollTop=msgs.scrollHeight;
}

async function sendChat(){
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();if(!msg)return;
  input.value='';
  chatHistory.push({role:'user',text:msg});render();
  try{
    const res=await fetch(`${API}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const json=await res.json();
    const reply=json.data?.reply||json.error||'응답 없음';
    const msgObj={role:'bot',text:reply};
    // pendingAction이 있으면 저장 + 메시지에 연결
    if(json.data?.pendingAction){
      pendingAction=json.data.pendingAction;
      msgObj.pendingAction=true;
      msgObj.text=reply+'\n\n⬇️ 아래 [확정] 버튼을 눌러야 실제 DB에 반영됩니다.';
    }
    chatHistory.push(msgObj);
    // 즉시 실행된 액션이 있으면 전체 데이터 리로드 (await로 완료 대기)
    if(json.data?.actions?.length) await loadAll();
  }catch(e){chatHistory.push({role:'bot',text:'오류: '+e.message})}
  render();
}

async function confirmPending(){
  if(!pendingAction){showToast('확정할 작업이 없습니다','var(--red)');return}
  chatHistory.push({role:'user',text:'✅ 확정'});
  try{
    const res=await fetch(`${API}/api/chat/confirm`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pendingAction})
    });
    const json=await res.json();
    const reply=json.data?.reply||json.data?.result?.message||'처리 완료';
    chatHistory.push({role:'bot',text:reply});
    pendingAction=null;
    await loadAll(); // 데이터 리로드 (완료 대기)
    showToast('DB 반영 완료 — 모든 탭에 즉시 반영');
  }catch(e){chatHistory.push({role:'bot',text:'확정 실패: '+e.message})}
  render();
}

function cancelPending(){
  pendingAction=null;
  chatHistory.push({role:'bot',text:'변경이 취소되었습니다.'});
  render();
}

async function saveEdit(e){
  e.preventDefault();
  const pk=document.getElementById('edit-pk').value;
  const newStatus=document.getElementById('edit-status').value;
  const signal=STATUS_EMOJI[newStatus]||'⚪';

  // 메모 합치기: 새 메모가 있으면 기존 메모 앞에 추가
  let notes=document.getElementById('edit-notes').value;
  const newMemo=document.getElementById('edit-memoNew').value.trim();
  const memoAuthor=document.getElementById('edit-memoAuthor').value.trim();
  const memoType=document.getElementById('edit-memoType').value;
  if(newMemo){
    const now=new Date();
    const dateStr=`${now.getMonth()+1}/${now.getDate()}`;
    const typeTag=memoType?`[${memoType}]`:'';
    const prefix=memoAuthor?`${typeTag}[${dateStr} ${memoAuthor}]`:`${typeTag}[${dateStr}]`;
    notes=`${prefix} ${newMemo}\n${notes}`.trim();
  }

  // 미팅 시간 합쳐서 저장
  let nextMeeting=document.getElementById('edit-nextMeeting').value;
  const meetingTime=document.getElementById('edit-meetingTime').value;
  const meetingVisitor=document.getElementById('edit-meetingVisitor').value;
  const meetingPurpose=document.getElementById('edit-meetingPurpose').value;

  const body={
    status:newStatus,
    signal:signal,
    md:document.getElementById('edit-md').value,
    region:document.getElementById('edit-region').value,
    siteCount:parseInt(document.getElementById('edit-siteCount').value)||0,
    nextMeeting:nextMeeting,
    meetingTime:meetingTime,
    meetingVisitor:meetingVisitor,
    meetingPurpose:meetingPurpose,
    contractDate:document.getElementById('edit-contractDate').value,
    planStartDate:document.getElementById('edit-planStartDate').value,
    notes:notes,
    campName:document.getElementById('edit-campName').value,
    holdReason:document.getElementById('edit-holdReason').value,
    phone:document.getElementById('edit-phone').value,
    revenue:document.getElementById('edit-revenue').value,
    consultation:document.getElementById('edit-consultation').value,
    weekdayRate:document.getElementById('edit-weekdayRate').value,
    weekendRate:document.getElementById('edit-weekendRate').value,
  };

  try{
    const res=await fetch(`${API}/api/camps/${encodeURIComponent(pk)}/profile`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const json=await res.json();
    if(json.success){
      const changes=[];
      const oldCamp=camps.find(x=>campKey(x)===pk);
      if(oldCamp){
        if(oldCamp.status!==newStatus)changes.push(`상태: ${oldCamp.status} → ${newStatus}`);
        if((oldCamp.md||'')!==body.md)changes.push(`담당자: ${oldCamp.md||'없음'} → ${body.md||'없음'}`);
        if((oldCamp.region||'')!==body.region)changes.push(`지역: ${body.region}`);
        if(body.nextMeeting&&oldCamp.nextMeeting!==body.nextMeeting)changes.push(`미팅일: ${body.nextMeeting} ${body.meetingTime||''}`);
        if(newMemo)changes.push(`메모: ${newMemo}`);
      }
      addLog('edit',pk,changes.length?changes.join(' / '):'정보 수정');
      showToast(`${pk} 정보가 저장되었습니다`);
      closeEditModal();
      await loadAll();
    }else{
      showToast(json.error||'수정 실패','var(--red)');
    }
  }catch(err){
    showToast('API 오류: '+err.message,'var(--red)');
  }
}

// ==================== ACTIVITY LOGS ====================
function renderLogs(el){
  const logs=getActivityLogs();
  const logIcons={create:'🆕',edit:'✏️',status:'🔄',task:'✅',note:'📝'};
  const logColors={create:'var(--green)',edit:'var(--accent)',status:'var(--purple)',task:'var(--yellow)',note:'var(--muted)'};

  // 날짜별 그룹
  const grouped={};
  logs.forEach(l=>{
    const d=l.time.slice(0,10);
    if(!grouped[d])grouped[d]=[];
    grouped[d].push(l);
  });

  // 오늘 통계
  const todayStr=new Date().toISOString().slice(0,10);
  const todayLogs=grouped[todayStr]||[];
  const todayCreates=todayLogs.filter(l=>l.type==='create').length;
  const todayEdits=todayLogs.filter(l=>l.type==='edit').length;
  const todayStatusChanges=todayLogs.filter(l=>l.type==='status').length;

  let html=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="display:flex;gap:12px">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px">
        오늘 활동 <b style="color:var(--green)">${todayLogs.length}</b>건
        ${todayCreates?` · 신규 <b style="color:var(--green)">${todayCreates}</b>`:''}
        ${todayEdits?` · 수정 <b style="color:var(--accent)">${todayEdits}</b>`:''}
        ${todayStatusChanges?` · 상태변경 <b style="color:var(--purple)">${todayStatusChanges}</b>`:''}
      </div>
    </div>
    <button onclick="if(confirm('전체 로그를 삭제하시겠습니까?')){localStorage.removeItem('picco_logs');render()}" style="background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer">로그 초기화</button>
  </div>`;

  if(!logs.length){
    html+='<div style="text-align:center;padding:40px;color:var(--muted)">아직 기록된 활동이 없습니다.<br>캠핑장을 등록하거나 수정하면 자동으로 기록됩니다.</div>';
    el.innerHTML=html;return;
  }

  Object.entries(grouped).forEach(([date,items])=>{
    const isToday=date===todayStr;
    html+=`<div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:${isToday?'var(--accent)':'var(--muted)'};padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:4px">
        ${isToday?'오늘':date} <span style="font-weight:400;font-size:11px">(${items.length}건)</span>
      </div>`;
    items.forEach(l=>{
      const t=new Date(l.time);
      const timeStr=`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
      const icon=logIcons[l.type]||'📌';
      const color=logColors[l.type]||'var(--muted)';
      html+=`<div class="log-item">
        <div class="log-time">${timeStr}</div>
        <div class="log-icon">${icon}</div>
        <div class="log-body"><b style="color:${color}">${l.camp}</b> ${l.detail||''}</div>
      </div>`;
    });
    html+=`</div>`;
  });

  el.innerHTML=html;
}

  closing:'다음에도 좋은 추억 만들어 가시길 바랍니다. 감사합니다!',
  traits:['존댓말 사용','이모티콘 적절 사용','감사 인사 포함','재방문 유도'],
  avgLength:150,
  samples:[]

// 스타일 분석 함수: 캠핑장의 기존 댓글들에서 패턴 추출
function analyzeStyle(replies){
  if(!replies||!replies.length)return null;
  const profile={samples:replies.slice(0,10),avgLength:0,traits:[],tone:'',greeting:'',closing:'',
    keywords:[],emojiUse:false,honorific:true,exclamation:0,questionMark:0};

  let totalLen=0,emojiCount=0,honorCount=0,excCount=0,qCount=0;
  const wordFreq={};

  replies.forEach(r=>{
    const text=r.reply||r.text||r;
    totalLen+=text.length;
    if(/[😀-🙏🌀-🗿🚀-🛿☀-⭕✂-➰🀄-🃏🅰-🆎]/u.test(text)||/[:;][)D(P]/g.test(text)||/ㅎㅎ|ㅋㅋ|😊|🙏|💚|🌿|🏕|⛺/g.test(text))emojiCount++;
    if(/습니다|세요|드립니다|감사합니다|바랍니다/g.test(text))honorCount++;
    excCount+=(text.match(/!/g)||[]).length;
    qCount+=(text.match(/\?/g)||[]).length;

    // 첫 문장(인사) 패턴
    const firstLine=text.split(/[.!?\n]/)[0];
    if(/안녕하세요|반갑습니다|감사합니다|소중한|방문해/i.test(firstLine))profile.greeting=firstLine.trim();

    // 마지막 문장(마무리) 패턴
    const sentences=text.split(/[.!?\n]/).filter(s=>s.trim());
    if(sentences.length>1){
      const last=sentences[sentences.length-1].trim();
      if(/감사|기다리|바랍니다|뵙겠|오세요|방문|재방문|추억/i.test(last))profile.closing=last;
    }

    // 키워드 빈도
    text.replace(/[^가-힣a-zA-Z\s]/g,'').split(/\s+/).filter(w=>w.length>1).forEach(w=>{wordFreq[w]=(wordFreq[w]||0)+1});
  });

  profile.avgLength=Math.round(totalLen/replies.length);
  profile.emojiUse=emojiCount>replies.length*0.3;
  profile.honorific=honorCount>replies.length*0.5;
  profile.exclamation=Math.round(excCount/replies.length*10)/10;

  // 톤 판단
  if(profile.emojiUse&&profile.exclamation>1)profile.tone='활기차고 친근한';
  else if(profile.honorific&&profile.avgLength>100)profile.tone='정중하고 격식 있는';
  else if(profile.avgLength<80)profile.tone='간결하고 심플한';
  else profile.tone='따뜻하고 친절한';

  // 특성 태그
  if(profile.honorific)profile.traits.push('존댓말');
  if(profile.emojiUse)profile.traits.push('이모티콘 활용');
  if(profile.avgLength>120)profile.traits.push('상세한 답변');
  if(profile.avgLength<=80)profile.traits.push('간결한 답변');
  if(profile.exclamation>1.5)profile.traits.push('느낌표 많이 사용');
  if(/감사/g.test(replies.join(' ')))profile.traits.push('감사 표현');
  if(/또|다시|재방문|다음/g.test(replies.join(' ')))profile.traits.push('재방문 유도');

  // 자주 쓰는 키워드 (상위 10개)
  profile.keywords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([w])=>w);

  return profile;
}

// 리뷰에서 키 토픽 추출
function extractTopics(review){
  const topics=[];
  if(/깨끗|청결|청소|위생/i.test(review))topics.push('청결');
  if(/친절|사장님|캠지기|주인/i.test(review))topics.push('친절');
  if(/경치|뷰|풍경|자연|계곡|산|호수|바다/i.test(review))topics.push('자연환경');
  if(/시설|화장실|샤워|매점|편의/i.test(review))topics.push('시설');
  if(/아이|아기|가족|아이들|아들|딸/i.test(review))topics.push('가족/아이');
  if(/조용|힐링|휴식|평화/i.test(review))topics.push('힐링');
  if(/음식|식사|고기|바베큐|BBQ|삼겹/i.test(review))topics.push('식사');
  if(/별|밤하늘|야경|불멍/i.test(review))topics.push('불멍/야경');
  if(/넓|사이트|간격|프라이빗|독립/i.test(review))topics.push('사이트 공간');
  if(/재방문|또|다시/i.test(review))topics.push('재방문의사');
  if(/아쉬|불편|별로|부족/i.test(review))topics.push('아쉬운점');
  return topics;
}

// 랜덤 선택 유틸
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

// 답변 생성 (캠핑장 페르소나 기반)
function generateReply(campName,review,profile){
  const p=profile||DEFAULT_STYLE;
  const topics=extractTopics(review);
  const isNeg=topics.includes('아쉬운점');
  const isCasual=p.tone&&(p.tone.includes('캐주얼')||p.tone.includes('친근')||p.tone.includes('솔직'));
  const isShort=p.avgLength&&p.avgLength<60;
  const isLong=p.avgLength&&p.avgLength>200;
  const useTilde=p.traits&&p.traits.some(t=>t.includes('물결'));
  const useKk=p.traits&&p.traits.some(t=>t.includes('ㅎㅎ')||t.includes('ㅋㅋ'));
  const endChar=useTilde?'~':p.exclamation>1?'!':'.';
  const smiley=p.emojiUse?(useTilde?'^-^':useKk?' ㅎㅎ':' ^^'):'';
  const isGeneric=topics.length===0||(review.length<30&&!isNeg);

  // 인사 (다양한 변형)
  let greeting='';
  if(p.greeting&&p.greeting.length>3){
    greeting=p.greeting.replace('{campName}',campName);
  }else if(isCasual){
    greeting=pick(['',`${campName}입니다${smiley}`,`안녕하세요${smiley}`]);
  }else{
    greeting=pick([

  // 감사 표현 (다양한 변형)

      `후기 작성해주셔서 감사해요${smiley}`,
    ]);
  }else{
    thanks=pick([
      `소중한 후기 남겨주셔서 정말 감사합니다${endChar}`,
